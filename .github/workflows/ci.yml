name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.1', laravel: '^9.0' }
          - { php: '8.1', laravel: '^10.0' }
          - { php: '8.2', laravel: '^10.0' }
          - { php: '8.2', laravel: '^11.0' }
          - { php: '8.3', laravel: '^11.0' }
          - { php: '8.3', laravel: '^12.0' }
          - { php: '8.4', laravel: '^12.0' }
          - { php: '8.4', laravel: '^13.0' }
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: opentelemetry, redis
          coverage: none
          tools: composer:v2
      - name: Validate composer.json
        run: composer validate --strict --no-check-lock
      - name: Install (Laravel ${{ matrix.laravel }})
        env:
          LARAVEL: ${{ matrix.laravel }}
        run: |
          composer require --dev --no-update "illuminate/events:${LARAVEL}"
          composer update --no-interaction --no-progress --prefer-dist
      - name: Unit tests
        run: vendor/bin/phpunit --testsuite unit
      - name: Integration tests (real extension hooks, real Redis)
        env:
          REDIS_HOST: 127.0.0.1
        run: |
          php -r 'exit(extension_loaded("opentelemetry") ? 0 : 1);' || { echo "::error::opentelemetry extension not loaded"; exit 1; }
          vendor/bin/phpunit --testsuite integration --fail-on-skipped

  lowest:
    name: Lowest dependencies (PHP 8.1)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.1'
          extensions: opentelemetry
          coverage: none
          tools: composer:v2
      - run: composer update --no-interaction --no-progress --prefer-lowest --prefer-stable
      - run: vendor/bin/phpunit --testsuite unit
