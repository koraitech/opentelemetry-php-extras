name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.read.outputs.include }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: read
        run: echo "include=$(jq -c . .github/versions.json)" >> "$GITHUB_OUTPUT"

  test:
    needs: matrix
    uses: ./.github/workflows/tests.yml
    with:
      matrix: ${{ needs.matrix.outputs.include }}

  lowest:
    name: Lowest dependencies (PHP 8.1)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.1'
          extensions: opentelemetry
          coverage: none
          tools: composer:v2
      - run: composer update --no-interaction --no-progress --prefer-lowest --prefer-stable
      - run: composer test:unit
